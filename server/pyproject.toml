[project]
name = "hermes-nag-server"
version = "0.1.0"
description = "HermesNag task service — source of truth on the Oracle box"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.14",
    "python-dateutil>=2.9",   # RRULE (RFC 5545) parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",            # FastAPI TestClient transport
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Rule 3: no sleeping to test time-based behaviour. Inject the clock.
addopts = "-q --strict-markers"

[tool.setuptools.packages.find]
include = ["app*"]
